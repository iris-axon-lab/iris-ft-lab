# Trace DPO config — prospective-memory policy shaping
#
# Backend: mlx-lm-lora v2.1.0 (mlx_lm_lora.train --train-mode dpo)
# KL anchored at SFT preserves the schema-alignment SFT taught.
#
# Adapter-stacking: SFT v2 fused into base first (scripts/fuse_sft.py),
# then a fresh DPO LoRA trains on top of the fused model.
#
# Policy goal: reinforce "witness, not coach" behavior.
#   Chosen:   correctly identifies prospective commitments when warranted;
#             neutral, structured output without advice or prescriptive framing.
#   Rejected: over-flattens commitment signals, adds coaching framing, or
#             misassigns tier on mixed episodic+prospective inputs.

model:
  path: "outputs/qwen25_3b_sft_fused"

reference_model:
  path: "outputs/qwen25_3b_sft_fused"

data:
  dir: "data/processed/dpo"        # contains train.jsonl + valid.jsonl

dpo:
  beta: 0.1
  loss_type: "sigmoid"

training:
  iters: 150
  batch_size: 2
  learning_rate: 5.0e-6
  max_seq_length: 512
  grad_checkpoint: true

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  num_layers: 16

output:
  adapter_path: "outputs/dpo_qwen25_3b_v0"
  save_every: 50
  steps_per_report: 10
