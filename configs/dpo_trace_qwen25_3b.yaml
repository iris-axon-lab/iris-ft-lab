# Trace DPO config — prospective-memory policy shaping
#
# STATUS: scaffold config — MLX-native DPO support is actively evolving.
# Before running, check: python scripts/train_dpo.py --config this_file
# train_dpo.py will detect whether DPO is available and exit honestly if not.
#
# Policy goal: reinforce "witness, not coach" behavior.
#   Chosen:   correctly identifies prospective commitments when warranted;
#             neutral, structured output without advice or prescriptive framing.
#   Rejected: over-flattens commitment signals into generic semantic descriptions,
#             or adds coaching / action recommendations.

model:
  # Start from the SFT-trained checkpoint when available (recommended).
  # The SFT adapter is the reference policy from which DPO diverges.
  path: "mlx-community/Qwen2.5-3B-Instruct-4bit"
  # Uncomment to start from a trained SFT adapter:
  # adapter_path: "outputs/sft_qwen25_3b"

data:
  train: "data/processed/dpo_train.jsonl"
  valid: "data/processed/dpo_val.jsonl"
  # DPO format: {"prompt": "...", "chosen": "...", "rejected": "..."}
  # This is NOT the messages format — see data/sample_dpo.jsonl for examples.
  format: "dpo"

dpo:
  # KL penalty weight — controls how far the trained policy can diverge
  # from the reference policy. Lower = more aggressive shaping.
  # 0.1 is a standard starting point; increase if the policy collapses.
  beta: 0.1

  # Reference model for computing the KL divergence baseline.
  # Set to the same base model (or the SFT checkpoint) used for initialization.
  reference_model: "mlx-community/Qwen2.5-3B-Instruct-4bit"

training:
  epochs: 1
  batch_size: 2
  learning_rate: 5.0e-5
  max_seq_length: 512
  grad_checkpoint: true

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

output:
  adapter_path: "outputs/dpo_qwen25_3b"
  save_every: 50
  steps_per_report: 10
