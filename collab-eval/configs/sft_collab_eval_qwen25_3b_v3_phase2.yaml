# SFT v3 phase 2 — mixed refinement at lower lr
# Resumes from phase 1 final checkpoint. lr is 40% of phase 1's peak so phase 1
# preservation gains are protected from being overwritten by phase 2's
# regular-case deletion gradients. 150 iters on 480 mixed cases (~1.25 epochs).

model: mlx-community/Qwen2.5-3B-Instruct-4bit
data: data/sft_collab_eval_full_v2
train: true
test: false

num_layers: 16
lora_parameters:
  rank: 4
  scale: 8.0
  dropout: 0.05

batch_size: 4
iters: 150
steps_per_eval: 50
save_every: 50
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 15
  arguments: [2.0e-5, 150, 2.0e-7]
grad_checkpoint: false

# resume_adapter_file loads phase 1 weights as init before training starts.
# adapter_path is where new checkpoints are written (save-only; does not load).
resume_adapter_file: adapters/sft_collab_eval_qwen25_3b_v3_phase1/adapters.safetensors
adapter_path: adapters/sft_collab_eval_qwen25_3b_v3/
max_seq_length: 2048
