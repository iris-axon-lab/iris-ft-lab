# SFT config for spreadsheet-cleaning tasks
# Base model: mlx-community/Qwen2.5-3B-Instruct-4bit
#
# Promotion gate (must be met before committing this adapter):
#   - composite improves by >= 0.10 over base
#   - hard-fail rate does not increase
#   - format_validity does not regress
#   - no obvious increase in reward-hacking behavior
#
# Note: base-model baseline (training_cycle_v0) reached composite 0.9569.
# The +0.10 gate is mathematically unreachable if composite is capped at 1.0.
# Gate is documented as-is and intentionally left for review before revision.
#
# Do NOT train unless the baseline gate passed:
#   - composite mean >= 0.30
#   - hard-fail rate <= 40%
# See results/model_baseline_v0.md for current gate status.

model: mlx-community/Qwen2.5-3B-Instruct-4bit
data: data/sft_collab_eval_full
train: true
test: false

# LoRA adapter settings
num_layers: 16
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0

# Training hyperparameters
batch_size: 4
iters: 1000
steps_per_eval: 200
save_every: 200
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [1.0e-4, 1000, 1.0e-6]
grad_checkpoint: false

# Output
adapter_path: adapters/sft_collab_eval_qwen25_3b/

# Sequence length
max_seq_length: 2048
